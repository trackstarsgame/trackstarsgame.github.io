<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Stars - World Tour</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #0d0d0d;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* --- 1. BANNER BLUR FIX --- */
    .timeline-hero {
      position: relative;
      padding: 25px 20px 20px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 520px;
      border-bottom: 1px solid #222;
      overflow: hidden; /* Hides the oversized blurred edges */
      z-index: 1; /* Establishes stacking context */
    }

    /* Blurred Background Layer */
    .timeline-hero::before {
      content: "";
      position: absolute;
      /* Oversize slightly so the blur doesn't create a transparent edge */
      top: -15px; left: -15px; right: -15px; bottom: -15px;
      background-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.85)), url('milan_banner.png');
      background-size: cover;
      background-position: center;
      filter: blur(8px); /* The blur effect */
      z-index: -1; /* Pushes background behind the text */
    }

    .city-hero-title {
      text-align: center;
      margin-top: 40px;
    }

    .city-hero-title h2 {
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.9);
    }

    .city-quick-specs {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-top: 20px;
      text-align: center;
    }

    .spec-label {
      font-size: 0.8rem;
      color: #bbbbbb;
      font-weight: 600;
      display: block;
    }

    .spec-value {
      font-size: 1rem;
      font-weight: 800;
      color: #ffffff;
    }

    /* Toggle Button */
    .expand-trigger {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 20px auto;
      cursor: pointer;
      padding: 10px;
      width: fit-content;
    }

    .expand-trigger i {
      font-size: 3rem;
      color: #ffffff;
      transition: transform 0.3s ease;
    }

    .expand-trigger.collapsed i {
      transform: rotate(180deg); /* Flips arrow when closed */
    }

    /* --- 2. CAROUSEL CLOSED BY DEFAULT FIX --- */
    .roster-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      transition: all 0.3s ease;
    }

    /* This class ensures it hides on load */
    .roster-container.hidden {
      display: none;
    }

    .characters-section, .boards-section {
      padding: 35px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .characters-section { background: linear-gradient(135deg, #ff65b3 0%, #d81b60 100%); }
    .boards-section { background: linear-gradient(135deg, #00bfff 0%, #0080ff 100%); }

    .carousel-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      width: 100%;
      max-width: 850px;
    }

    .char-slide, .board-slide {
      text-align: center;
    }

    .char-info h3 {
      font-size: 2rem;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- Blurred Header -->
  <header class="timeline-hero">
    <div class="city-hero-title">
      <h2>MILAN</h2>
      <p>Fashion Capital</p>
    </div>

    <div class="city-quick-specs">
      <div class="spec-item">
        <span class="spec-label">Characters</span>
        <span class="spec-value">PENNY<br>FABRIZIO<br>CHIARA</span>
      </div>
      <div class="spec-item">
        <span class="spec-label">Location</span>
        <span class="spec-value">ITALY</span>
      </div>
    </div>
    
    <!-- Expand/Collapse Trigger (Defaults to collapsed state) -->
    <div class="expand-trigger collapsed" id="toggle-btn">
      <i class="fas fa-chevron-up"></i>
    </div>
  </header>

  <!-- Carousel Container (Defaults to hidden) -->
  <div class="roster-container hidden" id="roster-carousel">
    
    <!-- Characters -->
    <div class="characters-section">
      <div class="carousel-wrapper">
        <i class="fas fa-arrow-left nav-arrow"></i>
        <div class="char-slide">
          <div class="char-info">
            <!-- Outfit selection functioning within character selected -->
            <h3 id="name text">PENNY</h3>
            <div class="outfits">
              <span>&#10003; Default</span> <!-- Checkmark indicator -->
            </div>
          </div>
        </div>
        <i class="fas fa-arrow-right nav-arrow"></i>
      </div>
    </div>

    <!-- Boards -->
    <div class="boards-section">
      <div class="carousel-wrapper">
        <i class="fas fa-arrow-left nav-arrow"></i>
        <div class="board-slide">
          <div class="char-info">
            <h3>PICTURE PERFECT</h3>
          </div>
        </div>
        <i class="fas fa-arrow-right nav-arrow"></i>
      </div>
    </div>

  </div>

  <!-- JavaScript to handle opening/closing -->
  <script>
    const toggleBtn = document.getElementById('toggle-btn');
    const rosterCarousel = document.getElementById('roster-carousel');

    toggleBtn.addEventListener('click', () => {
      // Toggles the hidden class on the carousel
      rosterCarousel.classList.toggle('hidden');
      
      // Toggles the arrow direction
      toggleBtn.classList.toggle('collapsed');
    });
  </script>

</body>
</html>
