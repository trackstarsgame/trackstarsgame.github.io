<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Stars - World Tour</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      overflow-x: hidden;
      background-color: #0d0d0d;
      color: #ffffff;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Banner with Dynamic City Background */
    .timeline-hero {
      position: relative;
      padding: 25px 20px 20px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 520px;
      border-bottom: 1px solid #222;
      overflow: hidden; /* Hides the oversized blurred edges */
      --hero-bg: url('milan_banner.png'); /* CSS variable for dynamic JS updates */
    }

    /* Blurred Background Layer */
    .timeline-hero::before {
      content: "";
      position: absolute;
      /* Oversize the background slightly so the blur doesn't create a transparent edge */
      top: -15px; left: -15px; right: -15px; bottom: -15px;
      background-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.85)), var(--hero-bg);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: blur(8px);
      z-index: 0;
      transition: background-image 0.4s ease-in-out;
    }

    /* Ensure text/content stays on top of the blurred background */
    .timeline-hero > * {
      position: relative;
      z-index: 1;
    }

    .back-home-btn {
      position: absolute;
      left: 20px;
      top: 20px;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 10;
      opacity: 0.85;
      transition: opacity 0.2s ease;
    }

    .back-home-btn:hover {
      opacity: 1;
    }

    /* World Tour Logo */
    .hero-logo-container {
      margin-top: 5px;
      margin-bottom: 15px;
      text-align: center;
    }

    .hero-logo-container img {
      max-height: 80px;
      width: auto;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.7));
    }

    /* City Title & Quick Specs Grid */
    .hero-display-grid {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
      max-width: 900px;
      gap: 20px;
      margin-bottom: 15px;
    }

    .city-hero-title h2 {
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      line-height: 1;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.9);
    }

    .city-hero-title p {
      font-size: 1.05rem;
      color: #dddddd;
      margin-top: 4px;
      font-weight: 500;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
    }

    .city-quick-specs {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 40px;
      width: 100%;
    }

    .spec-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 250px;
    }

    .spec-item .spec-label {
      font-size: 0.8rem;
      color: #bbbbbb;
      text-transform: capitalize;
      font-weight: 600;
    }

    .spec-item .spec-value {
      font-size: 1rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #ffffff;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
      line-height: 1.45;
      margin-top: 5px;
      text-align: center;
    }

    /* Interactive Timeline Slider Bar */
    .timeline-bar-wrapper {
      position: relative;
      width: 100%;
      max-width: 750px;
      margin-top: auto;
      padding-top: 10px;
    }

    .timeline-svg {
      width: 100%;
      height: 35px;
      overflow: visible;
    }

    .timeline-path {
      fill: none;
      stroke: rgba(255, 255, 255, 0.35);
      stroke-width: 2.5;
    }

    .timeline-nodes {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .time-node {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s ease;
    }

    .time-node:hover {
      transform: translateY(-2px);
    }

    .node-date {
      font-size: 0.725rem;
      font-weight: 700;
      color: #bbbbbb;
      margin-bottom: 5px;
      white-space: nowrap;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    }

    .node-dot {
      width: 14px;
      height: 14px;
      background-color: #333333;
      border: 3px solid #111111;
      border-radius: 50%;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.4);
      transition: all 0.25s ease;
    }

    .node-badge-logo {
      margin-top: 6px;
      max-height: 28px;
      width: auto;
      opacity: 0.65;
      transition: opacity 0.25s ease, transform 0.25s ease;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.8));
    }

    /* Active Timeline Node */
    .time-node.active .node-dot {
      background-color: #ffffff;
      box-shadow: 0 0 0 3px #ffcc00, 0 0 12px rgba(255, 204, 0, 0.8);
      transform: scale(1.25);
    }

    .time-node.active .node-date {
      color: #ffffff;
    }

    .time-node.active .node-badge-logo {
      opacity: 1;
      transform: scale(1.15);
    }

    /* Chevron Toggle Button */
    .expand-trigger {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 15px;
      cursor: pointer;
      padding: 5px;
    }

    .expand-trigger i {
      font-size: 3rem;
      color: #ffffff;
      transition: transform 0.3s ease;
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.6));
    }

    .expand-trigger.collapsed i {
      transform: rotate(180deg);
    }

    /* Dynamic Roster Display Area */
    .roster-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      transition: all 0.3s ease;
    }

    .roster-container.hidden {
      display: none;
    }

    /* Characters & Boards Sections */
    .characters-section, .boards-section {
      padding: 35px 0 45px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      transition: background 0.4s ease;
    }

    .characters-section {
      background: linear-gradient(135deg, #ff65b3 0%, #d81b60 100%);
    }

    .boards-section {
      background: linear-gradient(135deg, #00bfff 0%, #0080ff 100%);
    }

    .section-title {
      font-size: 2.2rem;
      font-weight: 800;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 20px;
      text-shadow: 1px 2px 4px rgba(0, 0, 0, 0.2);
      letter-spacing: 1.5px;
    }

    .carousel-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 850px;
      position: relative;
    }

    .nav-arrow {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 3rem;
      cursor: pointer;
      padding: 10px 15px;
      opacity: 0.9;
      transition: transform 0.2s, opacity 0.2s;
      z-index: 20;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
      flex-shrink: 0;
    }

    .nav-arrow:hover { opacity: 1; }
    .nav-arrow:active { transform: scale(0.9); }

    .slides-container {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      min-width: 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }

    .char-slide, .board-slide {
      display: none;
      align-items: center;
      justify-content: center;
      width: 100%;
      animation: fadeIn 0.3s ease;
      padding: 0 10px;
    }

    .char-slide.active, .board-slide.active {
      display: flex;
    }

    .char-img-container {
      width: 260px;
      height: 380px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
      margin-right: 20px;
    }

    .char-img-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center bottom;
      transform: scale(1.18);
      transform-origin: center bottom;
      filter: drop-shadow(0 12px 15px rgba(0,0,0,0.25));
    }

    .outfits {
      display: flex;
      flex-direction: row;
      gap: 10px;
      margin: 12px 0 15px 0;
    }

    .outfit-btn {
      width: 40px;
      height: 40px;
      background-color: #cce6ff;
      border: 2.5px solid #ffffff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 1.1rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      cursor: pointer;
      transition: transform 0.25s ease;
    }

    .outfit-btn.pink-shirt { background-color: #ffb3d9; }
    .outfit-btn.active {
      transform: scale(1.1);
      border-color: #ffcc00;
    }

    .char-info-container, .board-info-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding-left: 10px;
      max-width: 400px;
      min-width: 0;
    }

    .char-info-container h3, .board-info-container h3 {
      font-size: 2.3rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1;
      margin-bottom: 2px;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.15);
    }

    .subtitle {
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
      text-transform: lowercase;
      margin-bottom: 2px;
    }

    .meta-details {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-bottom: 8px;
      font-size: 1rem;
      font-weight: 700;
      color: #ffffff;
    }

    .age-zodiac-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .zodiac-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border: 2px solid #ffffff;
      border-radius: 50%;
      font-size: 0.9rem;
    }

    .char-tagline {
      font-size: 1.25rem;
      font-weight: 800;
      color: #ffffff;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .char-bio {
      font-size: 0.825rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.35;
      text-transform: lowercase;
      opacity: 0.95;
    }

    .board-img-container {
      flex: 1;
      display: flex;
      justify-content: flex-end;
      padding-right: 20px;
    }

    .board-img-container img {
      max-height: 170px;
      max-width: 100%;
      object-fit: contain;
      filter: drop-shadow(0 12px 12px rgba(0,0,0,0.25));
    }

    /* Modal Styling */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-card {
      background: #f8fafc;
      border-radius: 20px;
      max-width: 480px;
      width: 100%;
      padding: 26px 22px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      position: relative;
      text-align: center;
      color: #0f172a;
    }

    .close-modal-btn {
      position: absolute;
      top: 16px; right: 20px;
      font-size: 1.5rem;
      color: #64748b;
      cursor: pointer;
      background: none;
      border: none;
    }

    .credits-content h3 {
      font-size: 1.4rem;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .credits-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: left;
    }

    .credits-item {
      background-color: #ffffff;
      padding: 10px 14px;
      border-radius: 8px;
      border-left: 4px solid #d97706;
      border-top: 1px solid #e2e8f0;
      border-right: 1px solid #e2e8f0;
      border-bottom: 1px solid #e2e8f0;
    }

    .credits-item span {
      display: block;
      font-size: 0.7rem;
      text-transform: uppercase;
      font-weight: 800;
      color: #92400e;
    }

    .credits-item p {
      font-size: 0.9rem;
      font-weight: 700;
      color: #0f172a;
      margin-top: 2px;
    }

    /* Footer */
    footer {
      background-color: #121212;
      color: #d8d8d8;
      padding: 40px 8%;
      margin-top: auto;
      width: 100%;
      border-top: 1px solid #222;
    }

    .footer-content {
      max-width: 1000px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 30px;
    }

    .brand-col { display: flex; flex-direction: column; gap: 15px; }
    .footer-logo { max-width: 140px; height: auto; }
    .social-grid { display: flex; gap: 10px; }
    
    .social-link {
      width: 36px; height: 36px; border: 1px solid #555555; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #e0e0e0; text-decoration: none; font-size: 0.85rem;
    }

    .copyright { font-size: 0.78rem; color: #777777; }

    .nav-col ul { list-style: none; }
    .nav-col li { margin-bottom: 10px; }
    .nav-col a { color: #aaaaaa; text-decoration: none; font-size: 0.9rem; cursor: pointer; }
    .nav-col a:hover { color: #ffffff; }

    /* Mobile Responsive Adjustments */
    @media (max-width: 650px) {
      .timeline-hero { min-height: 480px; padding: 20px 15px 15px 15px; }
      .city-hero-title h2 { font-size: 2.2rem; }
      .city-quick-specs { gap: 15px; flex-wrap: wrap; }
      .spec-item .spec-value { font-size: 0.85rem; }
      
      .char-slide, .board-slide { flex-direction: column; text-align: center; }
      .char-img-container { width: 100%; max-width: 280px; height: 380px; margin-right: 0; margin-bottom: 0; }
      .char-img-container img { transform: scale(1.22); }
      
      .outfits { justify-content: center; margin: 10px 0 15px 0; }
      
      .char-info-container, .board-info-container { align-items: center; padding-left: 0; text-align: center; }
      .meta-details { align-items: center; }
      .char-bio { text-align: center; }
      .board-img-container { justify-content: center; padding-right: 0; margin-bottom: 10px; }
      .board-img-container img { max-height: 120px; }
      .nav-arrow { font-size: 2.2rem; padding: 5px; }
      .footer-content { grid-template-columns: 1fr; gap: 25px; }
    }
  </style>
</head>

        <div class="time-### Fixing the Carousel

If the characters and boards carousel is popping open by default when you start the game, it almost always comes down to one of two things:

1. **It’s active in the Inspector:** The GameObject for the carousel is currently toggled "on" (the checkbox next to its name in the top left of the Inspector) in your scene or inside the prefab itself. Unity saves the active state of UI panels exactly as you leave them. 
2. **A script is forcing it open:** You might have a line in your `Start()` or `Awake()` method in your UI manager script that is accidentally setting it to true, or it's tied to an initialization function that triggers the panel.

**How to fix it:**
*   **The quick fix:** Simply click the carousel GameObject in the Hierarchy and uncheck the active box in the Inspector before hitting Play or building the game. 
*   **The bulletproof code fix:** Force it closed right when the game starts so you don't have to worry about its Inspector state. Drop this in your menu script's `Start()` method:

```csharp
// Make sure to reference the carousel GameObject at the top of your script
public GameObject charactersAndBoardsCarousel;

void Start()
{
    // Forces the carousel closed on boot
    if(charactersAndBoardsCarousel != null)
    {
        charactersAndBoardsCarousel.SetActive(false);
    }
}
